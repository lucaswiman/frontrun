[build-system]
requires = ["maturin>=1.0,<2.0"]
# In-tree backend (build_backend.py) wrapping maturin. It compiles the native
# crates/io preload library and drops it into frontrun/ before delegating to
# maturin, so wheels built from the sdist (source installs) bundle it too. See
# issue #246.
build-backend = "build_backend"
backend-path = ["."]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "crates/dpor/Cargo.toml"
module-name = "frontrun._dpor"
python-source = "."
include = [
    # Ship the compiled preload library in the wheel (built by CI or by
    # build_backend.py when building from the sdist).
    { path = "frontrun/libfrontrun_io.*", format = "wheel" },
    # Ship the crates/io sources in the sdist so build_backend.py can compile
    # the preload library during a source install. maturin's sdist otherwise
    # follows only the crates/dpor manifest and omits this sibling crate.
    { path = "crates/io/Cargo.toml", format = "sdist" },
    { path = "crates/io/Cargo.lock", format = "sdist" },
    { path = "crates/io/src/**/*", format = "sdist" },
    { path = "build_backend.py", format = "sdist" },
]

[project]
name = "frontrun"
dynamic = ["version"]
description = "A library for deterministic concurrency testing that helps you reliably reproduce and test race conditions"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Lucas Wiman", email = "lucas.wiman@gmail.com"},
]
keywords = ["concurrency", "testing", "race-conditions", "threads", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
frontrun = "frontrun.cli:main"

[project.entry-points.pytest11]
frontrun = "frontrun.pytest_plugin"

[project.urls]
Homepage = "https://github.com/lucaswiman/frontrun"
Repository = "https://github.com/lucaswiman/frontrun.git"
Documentation = "https://lucaswiman.github.io/frontrun"
Changelog = "https://github.com/lucaswiman/frontrun/blob/main/CHANGELOG.rst"
Issues = "https://github.com/lucaswiman/frontrun/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
    "sphinx>=4.0",
    "furo",
    # Pinned: ruff's formatter output changes across minor versions (e.g. how
    # implicit string concatenations are joined), and `make check` runs
    # `ruff format --check`, so an unpinned ruff breaks lint on unrelated files.
    "ruff==0.16.0",
    "pyright>=1.1.0",
    "sqlglot>=20.0",
    "aiosqlite>=0.17.0",
    "pytest-asyncio>=0.21.0",
    "dill>=0.3.6",
]
sql = [
    "sqlglot>=20.0",
]
process = [
    # Cross-process exploration (execution="process") serialises worker callables
    # with dill and requires semantic SQL parsing because worker processes do
    # not use the coordinator's LD_PRELOAD endpoint-level fallback.
    "dill>=0.3.6",
    "sqlglot>=20.0",
]
sql-async = [
    "aiosqlite>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
timeout = 60
asyncio_mode = "auto"
markers = [
    "integration: tests requiring external services (redis, postgres, network)",
    "e2e: end-to-end tests that spawn real subprocesses",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "A", "C4", "ISC", "PIE", "Q", "LOG", "PERF"]
ignore = [
    "E402",   # Module level import not at top of file (valid in conftest.py)
    "E501",   # Line too long (conflicts with docstring formatting in some cases)
    "F841",   # Unused variable (often intentional in test setup)
    "C408",   # Unnecessary dict() call (dict() with kwargs is more readable)
    "PERF203",  # try-except in loop (performance suggestion, acceptable for test code)
    "UP015",    # Unnecessary open mode "r" (explicit mode aids readability in I/O tests)
]

[tool.pyright]
include = ["frontrun"]
exclude = ["**/node_modules", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportMissingTypeStubs = false
reportUnusedImport = false  # handled by ruff F401
reportPrivateImportUsage = false
reportPrivateUsage = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
venvPath = "."
venv = ".venv-3.10"
