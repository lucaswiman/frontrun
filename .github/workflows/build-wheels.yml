name: Build Wheels

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Version to inject (from release tag). Leave empty for dev builds.'
        required: false
        type: string

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Inject release version
        if: inputs.version != ''
        shell: bash
        run: |
          sed "s/^version = .*/version = \"${{ inputs.version }}\"/" Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: "${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, label: "Linux x86_64" }
          - { os: ubuntu-24.04-arm, target: aarch64, label: "Linux aarch64" }
          - { os: macos-14, target: aarch64, label: "macOS aarch64" }
    steps:
      - uses: actions/checkout@v7

      - name: Inject release version
        if: inputs.version != ''
        shell: bash
        run: |
          sed "s/^version = .*/version = \"${{ inputs.version }}\"/" Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

      - name: Set up Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Build I/O interception library (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --manifest-path crates/io/Cargo.toml
          cp crates/io/target/release/libfrontrun_io.dylib frontrun/libfrontrun_io.dylib

      - name: Build wheels (CPython)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # manylinux ships 3.15, but maturin's bundled cross-compilation
          # sysconfig currently stops at 3.14. Pass the real interpreter path.
          # https://github.com/pypa/manylinux#image-content
          args: >-
            --release --out dist --interpreter 3.10 3.11 3.12 3.13 3.14
            ${{ runner.os == 'Linux' && '/opt/python/cp315-cp315/bin/python' || '' }}
          manylinux: auto
          before-script-linux: |
            manylinux-interpreters ensure cp315-cp315
            cargo build --release --manifest-path crates/io/Cargo.toml
            cp crates/io/target/release/libfrontrun_io.so frontrun/libfrontrun_io.so 2>/dev/null || \
              cp crates/io/target/*/release/libfrontrun_io.so frontrun/libfrontrun_io.so

      - name: Build wheels (free-threaded)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # Paths bypass maturin's version/suffix lookup for the interpreters
          # provided by manylinux. macOS 3.15 needs a real interpreter below.
          args: >-
            --release --out dist --interpreter
            ${{ runner.os == 'Linux' && '/opt/python/cp314-cp314t/bin/python /opt/python/cp315-cp315t/bin/python' || '3.14t' }}
          manylinux: auto
          before-script-linux: |
            manylinux-interpreters ensure cp314-cp314t cp315-cp315t
            cargo build --release --manifest-path crates/io/Cargo.toml
            cp crates/io/target/release/libfrontrun_io.so frontrun/libfrontrun_io.so 2>/dev/null || \
              cp crates/io/target/*/release/libfrontrun_io.so frontrun/libfrontrun_io.so

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  macos-python315:
    name: "macOS aarch64 (Python ${{ matrix.python-version }})"
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.15', '3.15t']
    steps:
      - uses: actions/checkout@v7

      - name: Inject release version
        if: inputs.version != ''
        shell: bash
        run: |
          sed "s/^version = .*/version = \"${{ inputs.version }}\"/" Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build I/O interception library
        run: |
          cargo build --release --manifest-path crates/io/Cargo.toml
          cp crates/io/target/release/libfrontrun_io.dylib frontrun/libfrontrun_io.dylib

      - name: Build Python 3.15 wheel
        uses: PyO3/maturin-action@v1
        with:
          # No --target: use the installed interpreter instead of maturin's
          # bundled cross-compilation sysconfig, which stops at Python 3.14.
          container: off
          args: >-
            --release --out dist
            --interpreter '${{ steps.python.outputs.python-path }}'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-aarch64-${{ matrix.python-version }}
          path: dist/*.whl
